<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7f9d72"/>
      <stop offset="45%" stop-color="#5b7b52"/>
      <stop offset="100%" stop-color="#46633f"/>
    </linearGradient>

    <!-- Glass Specular Highlight -->
    <linearGradient id="glassGrad" x1="256" y1="32" x2="256" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="60" y="50" width="392" height="420" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>

    <!-- Badge Shadow -->
    <filter id="badgeShadow" x="280" y="280" width="180" height="180" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#064E3B" flood-opacity="0.35"/>
    </filter>

    <!-- Badge Gradient (Emerald to Cyan-Green) -->
    <linearGradient id="badgeGrad" x1="325" y1="325" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c98a4b"/>
      <stop offset="100%" stop-color="#a8693a"/>
    </linearGradient>

    <!-- Clip Top Gradient -->
    <linearGradient id="clipGrad" x1="196" y1="74" x2="316" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Glow -->
  <rect x="32" y="32" width="448" height="448" rx="40" stroke="url(#glassGrad)" stroke-width="4" fill="none"/>

  <!-- Top Glass Highlight Overlay -->
  <path d="M 32 140 C 32 80 80 32 140 32 L 372 32 C 432 32 480 80 480 140 C 480 185 380 220 256 220 C 132 220 32 185 32 140 Z" fill="url(#glassGrad)" opacity="0.6"/>

  <!-- Clipboard Sheet Card with Shadow -->
  <g filter="url(#cardShadow)">
    <rect x="112" y="92" width="288" height="328" rx="32" fill="#FFFFFF"/>
    
    <!-- Top Clip Element -->
    <rect x="196" y="74" width="120" height="36" rx="18" fill="url(#clipGrad)"/>
    <rect x="232" y="84" width="48" height="16" rx="8" fill="#E2E8F0"/>

    <!-- Item 1: Checked -->
    <rect x="144" y="148" width="36" height="36" rx="10" fill="#e6ecdd"/>
    <path d="M 153 166 L 160 173 L 171 159" stroke="#5b7b52" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="196" y="157" width="168" height="18" rx="9" fill="#1E293B"/>

    <!-- Item 2: Checked -->
    <rect x="144" y="212" width="36" height="36" rx="10" fill="#e6ecdd"/>
    <path d="M 153 230 L 160 237 L 171 223" stroke="#5b7b52" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="196" y="221" width="132" height="18" rx="9" fill="#475569"/>

    <!-- Item 3: In-Progress / Blank Box -->
    <rect x="144" y="276" width="36" height="36" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    <rect x="196" y="285" width="150" height="18" rx="9" fill="#94A3B8"/>

    <!-- Item 4: Line Preview -->
    <rect x="144" y="340" width="36" height="36" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2.5"/>
    <rect x="196" y="349" width="96" height="18" rx="9" fill="#CBD5E1"/>
  </g>

  <!-- Dynamic Floating Completed Checkmark Badge in Bottom-Right -->
  <g filter="url(#badgeShadow)">
    <circle cx="372" cy="372" r="54" fill="url(#badgeGrad)" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M 352 372 L 366 386 L 394 358" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>